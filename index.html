<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>MyFiles Music</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif}*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f5f6fc}header{padding:calc(env(safe-area-inset-top) + 22px) 18px 12px;background:#171b27}h1{margin:0;font-size:25px}small,.muted{color:#a5acc0}main{padding:18px 16px 180px;max-width:850px;margin:auto}button,.button{border:0;border-radius:12px;background:#333b53;color:white;padding:11px 13px;font-size:14px;cursor:pointer}button.primary,.button.primary{background:#6679ff}button:disabled{opacity:.4}input[type=file]{display:none}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.bar>*{flex-grow:1}#path{font-weight:600;margin:15px 0}.item{display:flex;align-items:center;gap:10px;background:#1b2030;border-radius:14px;margin:7px 0;padding:11px}.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .name button{background:transparent;text-align:left;width:100%;padding:4px}.item .sub{font-size:11px;color:#9fa8bf}.item .actions{display:flex;gap:5px}.item .actions button{padding:8px;background:#30384d}.icon{font-size:23px}#player{position:fixed;bottom:0;left:0;right:0;background:#242b3d;border-top:1px solid #4c5877;padding:14px 17px calc(env(safe-area-inset-bottom) + 15px);box-shadow:0 -4px 20px #0006}#now{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#seek{width:100%;accent-color:#8795ff}#controls{display:flex;align-items:center;justify-content:center;gap:13px}#controls button{min-width:55px}#status{font-size:12px;color:#b3bad0;margin-top:9px}#usage{font-size:12px;color:#b3bad0;margin:9px 0}#empty{color:#a5acc0;padding:35px 10px;text-align:center}dialog{background:#252c3d;color:white;border:1px solid #48516a;border-radius:16px;width:min(90vw,420px)}dialog::backdrop{background:#000a}dialog button{margin:5px}select,input[type=text]{background:#10131b;color:white;border:1px solid #59627c;border-radius:8px;padding:11px;width:100%;margin:9px 0}</style></head><body><header><h1>🎵 MyFiles Music</h1><small>自分だけのオフライン音楽ライブラリ</small></header><main><div class="bar"><label class="button primary" for="pick">＋ 音楽を取り込む</label><input id="pick" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac,.ogg" multiple><button id="newfolder">📁 フォルダ作成</button><button id="back">↩ 戻る</button></div><div id="usage"></div><div id="path">マイファイル</div><div id="list"></div><div id="status" role="status"></div></main><section id="player"><div id="now">曲を選んでください</div><audio id="audio" preload="metadata"></audio><input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置"><div id="controls"><button id="shuffle" title="シャッフル">🔀</button><button id="prev" title="前の曲">⏮</button><button id="play" class="primary" title="再生・一時停止">▶</button><button id="next" title="次の曲">⏭</button><button id="repeat" title="リピート">🔁</button></div><div class="muted" id="time">0:00 / 0:00</div></section><dialog id="dlg"><div id="dialogcontent"></div><button id="cancel">キャンセル</button></dialog><script src="app.js"></script></body></html>
